<style>
:root{

  --gp:#2a78d6; --robi:#eb6834; --bl:#1baf7a; --tt:#eda100; --total:#0E8A86;
  --up:#127a52; --down:#b3261e;

}

}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1A1A; --surface:#152323; --ink:#E6F0EF; --muted:#A3B8B6; --faint:#7F9694; --line:#28403F; --grid:#203535;
  --accent:#5CC9C3; --amber:#F2B254; --band:rgba(92,201,195,.09); --hero:linear-gradient(120deg,rgba(92,201,195,.10),rgba(242,178,84,.08));
  --gp:#3987e5; --robi:#d95926; --bl:#199e70; --tt:#c98500; --total:#3FB4AE; --up:#5fd3a0; --down:#ff8a80;
}
html[lang="bn"]{--display:'Hind Siliguri',system-ui,sans-serif;--body:'Hind Siliguri',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
html[lang="bn"] body{line-height:1.7}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
html[lang="bn"] h1,html[lang="bn"] h2,html[lang="bn"] h3{letter-spacing:0;line-height:1.3}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:10}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:62px}
.mark{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;color:var(--ink);text-decoration:none;min-width:0}
.mark svg{flex:none}
.mark span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{display:flex;align-items:center;gap:8px;flex:none}
.ctl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .92rem var(--display);cursor:pointer}
.ctl:hover{border-color:var(--accent)}
.ctl svg{width:18px;height:18px}
.ctl.icon{padding:0;width:38px}
.lang b{font-weight:700}.lang .off{color:var(--faint);font-weight:500}
.back{font-family:var(--display);font-weight:500;color:var(--muted);font-size:.92rem;text-decoration:none}
@media (max-width:560px){.back{display:none}.mark span{max-width:44vw}}

/* hero */
header.intro{padding:40px 0 26px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;color:var(--accent);font-size:.96rem;margin:0 0 12px}
.kicker svg{width:18px;height:18px}
header.intro h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:700;letter-spacing:-.025em}
html[lang="bn"] header.intro h1{font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:0}
.dek{color:var(--muted);font-size:1.12rem;max-width:62ch;margin:16px 0 0}
.meta{font-size:.92rem;color:var(--faint);margin-top:12px}
.art{background:var(--hero);border:1px solid var(--line);border-radius:18px;padding:16px;aspect-ratio:5/4;display:grid;place-items:center}
.art svg{width:100%;height:100%}
@media (max-width:820px){header.intro{grid-template-columns:1fr}.art{aspect-ratio:auto;height:180px}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px;display:flex;flex-direction:column}
.tile .h{display:flex;align-items:center;gap:8px}
.tile .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.tile .ic svg{width:17px;height:17px}
.tile .l{font-size:.9rem;color:var(--muted);line-height:1.3}
.tile .v{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:-.02em;margin:8px 0 0;font-variant-numeric:tabular-nums}
.tile .v small{font-size:.5em;color:var(--muted);font-weight:500;margin-left:3px}
.tile .d{font-size:.88rem;color:var(--muted)}
.tile .d b.up{color:var(--up)}.tile .d b.down{color:var(--down)}
.tile .spark{margin-top:auto;padding-top:8px}
.tile .spark svg{display:block;width:100%;height:30px}

section.block{padding:30px 0 6px}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sechead h2{font-size:clamp(1.3rem,2.6vw,1.7rem);display:inline-flex;align-items:center;gap:10px}
.sechead h2 svg{width:22px;height:22px;color:var(--accent);flex:none}
.sechead p{margin:0;color:var(--muted);max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px 14px;position:relative}
.card h3{font-size:1.08rem;font-weight:600}
.card .sub{color:var(--muted);font-size:.95rem;margin:2px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);font-size:12px;fill:var(--muted)}
.chart .lbl{font-weight:600;fill:var(--ink);font-size:12.5px}
.chart .note{fill:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 6px;font-size:.93rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:16px;height:2.5px;border-radius:2px}
.badge{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font:700 10.5px/1 'Space Grotesk',system-ui,sans-serif;letter-spacing:.02em;flex:none}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px -12px rgba(0,0,0,.35);font-size:.88rem;min-width:160px;opacity:0;transition:opacity .1s}
.tip .m{color:var(--muted);font-size:.82rem;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tip .r i{width:12px;height:2.5px;border-radius:2px;display:inline-block}
.tip .r b{font-variant-numeric:tabular-nums;color:var(--ink)}

/* operator strip */
.ops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.op{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.op .badge{width:40px;height:40px;font-size:13px;grid-row:span 2}
.op b{font-family:var(--display);font-weight:600}
.op .s{color:var(--muted);font-size:.9rem;line-height:1.35}
.op .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:8px}
.op .bar i{display:block;height:100%;border-radius:3px}
.op .fig{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.op .fig .up{color:var(--up);font-weight:600}.op .fig .down{color:var(--down);font-weight:600}

.findings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.find{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.find .fi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;grid-row:span 2}
.find .fi svg{width:20px;height:20px}
.find b{font-family:var(--display);font-weight:600;display:block;font-size:1.04rem;line-height:1.3}
.find p{margin:0;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.93rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--display);font-weight:600;font-size:.86rem;color:var(--muted)}
th .badge{width:22px;height:22px;font-size:9px;vertical-align:middle;margin-right:6px}
td.gap{color:var(--faint)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
td .pos{color:var(--up);font-weight:600}td .neg{color:var(--down);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:.95rem;background:none;cursor:pointer}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--paper)}
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.step .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 .9rem var(--display);margin-bottom:8px}
.step b{display:block;font-family:var(--display);font-weight:600;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:.97rem}
pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:.82rem;line-height:1.45;color:var(--ink)}
footer{padding:30px 0 44px;color:var(--faint);font-size:.92rem;border-top:1px solid var(--line);margin-top:36px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
@media (max-width:820px){.tiles,.ops{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.findings,.steps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
